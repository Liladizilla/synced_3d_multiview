name: 3D Multiview CI

on:
  push:
    branches: [master, main, "revive/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  group: multiview-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and browser-smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm test
